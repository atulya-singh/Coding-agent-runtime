# Default agent configuration. Loaded by Agent.config.load_config; see
# Agent/config.py for the authoritative field types and defaults.
#
# This describes how the loop talks to a model -- not what it's solving (that's
# Tasks/dataset/<task_id>/task.yaml) -- so the same config can run any task.

model: claude-sonnet-5

# Per-request output cap passed to the Messages API.
max_tokens: 4096

# Hard stop on loop iterations (one iteration = one round of tool calls). Also
# the denominator Phase 5's kill/resume experiment uses for "10% of expected
# execution".
max_turns: 40

# Cumulative budgets for the whole run, independent of max_turns -- a handful
# of long turns can exhaust either well before max_turns is reached. Leave
# null for unbounded.
max_total_tokens: null
max_cost_usd: null

# Per-request timeout, in seconds.
request_timeout: 120.0
